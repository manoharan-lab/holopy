name: build and test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # ,macos-latest, windows-latest]
        python-version: ["3.9"] # , "3.10", "3.11", "3.12"]
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies through pip
      run: |
        pip install build coverage coveralls flake8 pytest scipy pyyaml pillow pandas h5py h5netcdf sphinx matplotlib emcee==2.2.1 cma schwimmbad numpy==1.20.3 xarray sphinx_rtd_theme numexpr meson meson-python ninja
    - name: Lint with flake8
      run: |
        conda install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Build package and install
      run: |
        python -m pip install --no-build-isolation --editable .
    - name: Test with pytest
      run: |
        pytest
